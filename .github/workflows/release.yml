name: Release

# Push a tag like v1.0.1 to build a universal app and publish it as a GitHub release.
# install.sh downloads SonosAceBattery.zip from the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build universal app
        run: VERSION="$GITHUB_REF_NAME" ./build.sh --dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Sonos Ace Battery ${GITHUB_REF_NAME#v}" \
            --generate-notes
