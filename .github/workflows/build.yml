name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build universal app
        run: ./build.sh --dist

      - name: Check installer scripts
        run: bash -n install.sh && bash -n uninstall.sh
